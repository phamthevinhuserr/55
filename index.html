  {id:"TF-8", title:"Câu 8. Ứng dụng CNSH xử lí khí độc trong nước nuôi thuỷ sản", items:},
  {id:"TF-9", title:"Câu 9. Quan sát màu nước ao nuôi", items:[{key:"a", text:"Màu nước phù hợp nhất cho thuỷ sản nước ngọt là xanh nhạt (xanh nõn chuối) do tảo lục phát triển.", answer:true}, {key:"b", text:"Nước lợ, mặn: màu thích hợp là vàng nâu (nước trà) và xanh rêu.", answer:false}, {key:"c", text:"Quan sát màu nước giúp đánh giá chất lượng nước và điều chỉnh kịp thời cho tôm, cá.", answer:true}, {key:"d", text:"Các màu không phù hợp: xanh rêu, vàng cam, đỏ gạch.", answer:true}]},
  {id:"TF-10", title:"Câu 10. Biện pháp xử lí nước thải nuôi thuỷ sản", items:}
];

// --- LOGIC XỬ LÝ ---
let currentPool =;
let currentIndex = 0;
let userAnswers = {};
let isWaiting = false;

// Khởi động Quiz theo loại (MCQ hoặc True/False)
function startQuiz(type) {
  currentPool = DATA.filter(q => q.id.startsWith(type === 'mcq'? 'MCQ' : 'TF'));
  currentIndex = 0;
  userAnswers = {};
  isWaiting = false;

  const menu = document.getElementById('menuScreen');
  const quiz = document.getElementById('quizScreen');
  
  menu.classList.add('hidden');
  quiz.classList.remove('hidden');
  quiz.classList.add('animate-in', 'fade-in', 'slide-in-from-right-4');

  document.getElementById('modeTag').textContent = type === 'mcq'? 'PHẦN I' : 'PHẦN II';
  renderQuestion();
}

// Quay lại màn hình chính
function backToMenu() {
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.add('hidden');
  
  const menu = document.getElementById('menuScreen');
  menu.classList.remove('hidden');
  menu.classList.add('animate-in', 'fade-in', 'slide-in-from-left-4');
  
  // Reset trạng thái
  currentPool =;
  currentIndex = 0;
  userAnswers = {};
}

// Render câu hỏi hiện tại
function renderQuestion() {
  if (currentIndex >= currentPool.length) { showResult(); return; }
  
  const q = currentPool[currentIndex];
  const grid = document.getElementById('optionsGrid');
  const title = document.getElementById('qTitle');
  
  // Cập nhật nội dung
  document.getElementById('qIndex').textContent = currentIndex + 1;
  title.textContent = q.title;
  document.getElementById('qPrompt').textContent = q.prompt |

| "";
  
  // Cập nhật Progress Bar
  const progress = ((currentIndex + 1) / currentPool.length) * 100;
  document.getElementById('progressBar').style.width = `${progress}%`;
  
  // Nút điều hướng
  document.getElementById('btnPrev').disabled = currentIndex === 0;
  
  // Focus Management (A11y): Chuyển focus về tiêu đề câu hỏi
  title.focus();

  grid.innerHTML = '';

  // Render MCQ
  if (q.id.startsWith('MCQ')) {
    q.choices.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'btn-option group';
      btn.innerHTML = `
        <div class="w-8 h-8 rounded-lg bg-zinc-900 border border-zinc-700 flex items-center justify-center text-xs font-bold text-zinc-500 shrink-0 mt-0.5 group-hover:bg-zinc-800 transition-colors">${c.key}</div>
        <div class="text-sm text-zinc-300 leading-relaxed font-medium group-hover:text-white">${c.text}</div>
      `;
      
      const ua = userAnswers[currentIndex];
      if (ua) {
        if (c.key === q.answer) btn.classList.add('correct');
        else if (c.key === ua) btn.classList.add('wrong');
        btn.disabled = true;
      } else {
        btn.onclick = () =>!isWaiting && selectMCQ(c.key);
      }
      grid.appendChild(btn);
    });
  } 
  // Render True/False
  else {
    q.items.forEach((item, idx) => {
      const row = document.createElement('div');
      row.className = 'p-6 glass rounded-2xl border border-zinc-800 space-y-4';
      row.innerHTML = `
        <p class="text-[14px] text-zinc-200 leading-relaxed"><span class="font-bold text-emerald-500 mr-2 border border-emerald-500/30 px-2 py-0.5 rounded text-xs">${item.key.toUpperCase()}</span>${item.text}</p>
        <div class="flex gap-3">
          <button data-val="true" class="flex-1 py-3 rounded-xl bg-zinc-900 border border-zinc-800 text-[10px] font-black uppercase tracking-widest text-zinc-500 hover:bg-zinc-800 transition-colors focus:outline-none focus:ring-2 focus:ring-emerald-500">Đúng</button>
          <button data-val="false" class="flex-1 py-3 rounded-xl bg-zinc-900 border border-zinc-800 text-[10px] font-black uppercase tracking-widest text-zinc-500 hover:bg-zinc-800 transition-colors focus:outline-none focus:ring-2 focus:ring-red-500">Sai</button>
        </div>
      `;
      
      const ua = userAnswers[currentIndex];
      const btns = row.querySelectorAll('button');
      
      btns.forEach(b => {
        const val = b.getAttribute('data-val') === 'true';
        if (ua && ua[idx]!== undefined) {
          if (val === ua[idx]) {
            b.classList.remove('bg-zinc-900', 'text-zinc-500');
            b.classList.add(val === item.answer? 'bg-emerald-500/20' : 'bg-red-500/20');
            b.classList.add(val === item.answer? 'text-emerald-500' : 'text-red-500');
            b.classList.add(val === item.answer? 'border-emerald-500' : 'border-red-500');
          } else {
            b.style.opacity = '0.3';
          }
          b.disabled = true;
        } else {
          b.onclick = () =>!isWaiting && selectTF(idx, val);
        }
      });
      grid.appendChild(row);
    });
  }
  updateLiveScore();
}

// Xử lý chọn đáp án MCQ
function selectMCQ(key) {
  userAnswers[currentIndex] = key;
  isWaiting = true;
  renderQuestion(); // Re-render để hiện màu đúng/sai
  setTimeout(() => {
    isWaiting = false;
    // Tự động chuyển câu sau 1s nếu chưa hết câu hỏi
    if (currentIndex < currentPool.length - 1) {
      changeQuestion(1);
    }
  }, 800);
}

// Xử lý chọn đáp án True/False
function selectTF(idx, val) {
  if (!userAnswers[currentIndex]) userAnswers[currentIndex] = {};
  userAnswers[currentIndex][idx] = val;
  renderQuestion();
}

// Chuyển câu hỏi
function changeQuestion(step) {
  if (isWaiting) return;
  currentIndex += step;
  renderQuestion();
}

// Tính điểm Live
function updateLiveScore() {
  let score = 0;
  Object.keys(userAnswers).forEach(idx => {
    const q = currentPool[idx];
    if (q.id.startsWith('MCQ')) {
      if (userAnswers[idx] === q.answer) score++;
    } else if (Object.keys(userAnswers[idx]).length === 4) {
      if (q.items.every((it, i) => userAnswers[idx][i] === it.answer)) score++;
    }
  });
  document.getElementById('liveScore').textContent = score;
}

// Hiển thị kết quả & Bắn pháo giấy
function showResult() {
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.remove('hidden');
  
  let score = 0;
  Object.keys(userAnswers).forEach(idx => {
    const q = currentPool[idx];
    if (q.id.startsWith('MCQ')) {
      if (userAnswers[idx] === q.answer) score++;
    } else if (Object.keys(userAnswers[idx]).length === 4) {
      if (q.items.every((it, i) => userAnswers[idx][i] === it.answer)) score++;
    }
  });
  
  const percentage = Math.round((score / currentPool.length) * 100);
  document.getElementById('resCorrect').textContent = score + "/" + currentPool.length;
  document.getElementById('resPercent').textContent = percentage + '%';

  // Hiệu ứng ăn mừng nếu điểm > 50%
  if (percentage >= 50 && typeof confetti === 'function') {
    const duration = 3000;
    const end = Date.now() + duration;

    (function frame() {
      confetti({
        particleCount: 5,
        angle: 60,
        spread: 55,
        origin: { x: 0 },
        colors: ['#10b981', '#34d399', '#ffffff'] // Màu xanh ngọc chủ đạo
      });
      confetti({
        particleCount: 5,
        angle: 120,
        spread: 55,
        origin: { x: 1 },
        colors: ['#10b981', '#34d399', '#ffffff']
      });

      if (Date.now() < end) {
        requestAnimationFrame(frame);
      }
    }());
  }
}
</script>
