/* ====== QUIZ ENGINE ====== */
const AUTONEXT_MS = 650;

let state = { idx: 0, score: 0, answers: {} };
const el = (id) => document.getElementById(id);
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));

function resetAll(){
  state = { idx: 0, score: 0, answers: {} };
  el("done").classList.add("hidden");
  el("card").classList.remove("hidden");
  render();
}

function computeScore(){
  let correct = 0;
  for (const q of DATA){
    const ua = state.answers[q.id];
    if (q.type === "mcq"){
      if (ua && ua === q.answer) correct += 1;
    } else {
      if (!ua) continue;
      const ok = ["a","b","c","d"].every(k => ua[k] === q.items.find(it=>it.key===k).answer);
      if (ok) correct += 1;
    }
  }
  state.score = correct;
}

function showDone(){
  computeScore();
  const total = DATA.length;
  const correct = state.score;
  const rate = Math.round((correct/total)*1000)/10;

  el("statTotal").textContent = total;
  el("statCorrect").textContent = correct;
  el("statRate").textContent = `${rate}%`;

  el("card").classList.add("hidden");
  el("done").classList.remove("hidden");
}

function hideFeedback(){
  const fb = el("feedback");
  fb.classList.add("hidden");
  fb.className = "mt-5 hidden rounded-xl border p-4 text-sm whitespace-pre-line";
  fb.textContent = "";
}

function showFeedback(ok, text){
  const fb = el("feedback");
  fb.classList.remove("hidden");
  fb.classList.add(ok ? "border-emerald-500/60" : "border-rose-500/60");
  fb.classList.add(ok ? "bg-emerald-500/10" : "bg-rose-500/10");
  fb.textContent = text;
}

function handleMCQAnswer(q, picked){
  if (state.answers[q.id]) return;
  state.answers[q.id] = picked;
  const ok = picked === q.answer;
  showFeedback(ok, ok ? "✅ Đúng!" : `❌ Sai.\nĐáp án đúng: ${q.answer}`);
  render();
  setTimeout(() => gotoNext(), AUTONEXT_MS);
}

function showTFResult(q){
  const ua = state.answers[q.id];
  const ok = ["a","b","c","d"].every(k => ua[k] === q.items.find(it=>it.key===k).answer);
  showFeedback(ok, ok ? "✅ Đúng (cả 4 ý)!" : "❌ Sai (có ít nhất 1 ý sai).");
}

function gotoNext(){
  if (state.idx >= DATA.length - 1){
    showDone();
    return;
  }
  state.idx = clamp(state.idx + 1, 0, DATA.length - 1);
  render();
}

function gotoPrev(){
  state.idx = clamp(state.idx - 1, 0, DATA.length - 1);
  render();
}

function revealAnswer(){
  const q = DATA[state.idx];
  if (q.type === "mcq"){
    showFeedback(true, `Đáp án đúng: ${q.answer}`);
  } else {
    const s = q.items.map(it => `${it.key}) ${it.answer ? "ĐÚNG" : "SAI"}\n- ${it.text}`).join("\n\n");
    showFeedback(true, `Đáp án:\n${s}`);
  }
}

function render(){
  computeScore();
  const q = DATA[state.idx];

  el("scoreBox").textContent = state.score;
  el("sectionTag").textContent = q.section;
  el("qTitle").textContent = `(${state.idx+1}/${DATA.length}) ${q.title}`;
  el("qPrompt").textContent = q.prompt || "";

  const pct = Math.round(((state.idx)/DATA.length)*1000)/10;
  el("metaLeft").textContent = `Tiến độ: ${pct}%`;
  el("metaRight").textContent = `Điểm: ${state.score}/${DATA.length}`;
  el("bar").style.width = `${(state.idx / DATA.length)*100}%`;

  el("btnPrev").disabled = state.idx === 0;
  el("btnNext").disabled = state.idx >= DATA.length - 1;

  hideFeedback();

  const wrap = el("choices");
  wrap.innerHTML = "";

  if (q.type === "mcq"){
    const ua = state.answers[q.id];
    q.choices.forEach(c => {
      const btn = document.createElement("button");
      btn.className = "text-left w-full rounded-2xl border border-zinc-800 bg-zinc-950 px-4 py-3 hover:bg-zinc-900 transition";
      btn.innerHTML = `
        <div class="flex items-start gap-3">
          <div class="mt-0.5 w-7 h-7 shrink-0 grid place-items-center rounded-lg bg-zinc-800 font-semibold">${c.key}</div>
          <div class="text-sm text-zinc-200 leading-relaxed">${c.text}</div>
        </div>
      `;
      btn.onclick = () => handleMCQAnswer(q, c.key);

      if (ua){
        btn.disabled = true;
        btn.classList.add("opacity-80","cursor-not-allowed");
        if (c.key === q.answer) btn.classList.add("border-emerald-500");
        if (c.key === ua && ua !== q.answer) btn.classList.add("border-rose-500");
      }
      wrap.appendChild(btn);
    });
  } else {
    const ua = state.answers[q.id] || null;

    q.items.forEach(item => {
      const row = document.createElement("div");
      row.className = "rounded-2xl border border-zinc-800 bg-zinc-950 p-4";
      row.innerHTML = `
        <div class="flex flex-col gap-3">
          <div class="text-sm leading-relaxed">
            <span class="font-semibold">${item.key})</span> ${item.text}
          </div>
          <div class="flex gap-2">
            <button data-k="true" class="px-3 py-2 rounded-xl bg-zinc-800 hover:bg-zinc-700 transition text-sm">ĐÚNG</button>
            <button data-k="false" class="px-3 py-2 rounded-xl bg-zinc-800 hover:bg-zinc-700 transition text-sm">SAI</button>
          </div>
        </div>
      `;

      const btnTrue = row.querySelector('button[data-k="true"]');
      const btnFalse = row.querySelector('button[data-k="false"]');

      const clickPick = (val) => {
        if (!state.answers[q.id]) state.answers[q.id] = {a:null,b:null,c:null,d:null};
        state.answers[q.id][item.key] = val;
        render();
        const cur = state.answers[q.id];
        const done4 = ["a","b","c","d"].every(k => cur[k] === true || cur[k] === false);
        if (done4){
          showTFResult(q);
          setTimeout(() => gotoNext(), AUTONEXT_MS);
        }
      };

      btnTrue.onclick = () => clickPick(true);
      btnFalse.onclick = () => clickPick(false);

      wrap.appendChild(row);

      // highlight picked
      const picked = ua ? ua[item.key] : undefined;
      if (picked === true) btnTrue.classList.add("ring-2","ring-emerald-400");
      if (picked === false) btnFalse.classList.add("ring-2","ring-rose-400");

      // lock if fully answered
      if (ua && ["a","b","c","d"].every(k => ua[k] === true || ua[k] === false)){
        btnTrue.disabled = true; btnFalse.disabled = true;
        btnTrue.classList.add("opacity-80","cursor-not-allowed");
        btnFalse.classList.add("opacity-80","cursor-not-allowed");
      }
    });

    if (ua && ["a","b","c","d"].every(k => ua[k] === true || ua[k] === false)){
      showTFResult(q);
    }
  }
}

el("btnNext").onclick = () => gotoNext();
el("btnPrev").onclick = () => gotoPrev();
el("btnReveal").onclick = () => revealAnswer();
el("btnReset").onclick = () => resetAll();
el("btnRestart2").onclick = () => resetAll();

render();
</script>
